summary: a real editor LSP client (neovim) can use gopls over stdio and as a daemon

prepare: |
  # neovim's built-in LSP client, run headless - the snap rather than apt as
  # the archive's neovim predates the LSP client on 20.04 and is too old for
  # its current API on 22.04
  snap install nvim --classic
  cp -r "$SPREAD_PATH"/tests/lib/hello workspace
  # a second file in the same package referencing an undefined identifier
  cat > workspace/broken.go <<'GO'
  package main

  func broken() int {
  	return undefinedThing
  }
  GO

restore: |
  if [ -f gopls.pid ]; then
    kill "$(cat gopls.pid)" || true
  fi
  rm -rf workspace gopls.pid gopls.sock
  snap remove --purge nvim

execute: |
  # over stdio, as editors usually run it
  nvim --clean -l "$SPREAD_PATH"/tests/lsp/lsp.lua workspace

  # connecting to a separately started gopls daemon instead (with its output
  # redirected so spread doesn't wait on it)
  gopls serve -listen="unix;$PWD/gopls.sock" > /dev/null 2>&1 &
  echo $! > gopls.pid
  for _ in $(seq 30); do
    test -S gopls.sock && break
    sleep 1
  done
  nvim --clean -l "$SPREAD_PATH"/tests/lsp/lsp.lua workspace "$PWD"/gopls.sock
