summary: gopls CLI subcommands analyse a real Go module

prepare: |
  cp -r "$SPREAD_PATH"/tests/lib/hello .

restore: |
  if [ -f gopls.pid ]; then
    kill "$(cat gopls.pid)" || true
  fi
  rm -rf hello gopls.pid gopls.sock

execute: |
  # sanity check the toolchain gopls relies on can build the module
  (cd hello && go build -o /dev/null ./...)

  cd hello

  # a clean package has no diagnostics
  gopls check main.go 2>&1 | NOMATCH .

  # line 10 col 14 is the greet call in main()
  gopls definition main.go:10:14 | MATCH 'main.go:5:6-11: defined here as func greet\(name string\) string'

  # declaration plus the one call site
  gopls references -d main.go:5:6 > refs
  MATCH 'main.go:5:6-11' < refs
  MATCH 'main.go:10:14-19' < refs

  # jumping into the standard library needs the go toolchain's GOROOT
  gopls definition main.go:10:6 | MATCH '/src/fmt/print.go:[0-9:-]+: defined here as func fmt.Println\(a \.\.\.any\)'

  # reformat a deliberately mangled copy and check it matches the original
  sed -e 's/^\t//' -e 's/) string {/)string{/' main.go > ugly.go
  gopls format ugly.go | diff -u main.go -
  rm ugly.go

  # an undefined identifier is reported as an error
  printf 'package main\n\nfunc broken() int {\n\treturn undefinedThing\n}\n' > broken.go
  gopls check broken.go 2>&1 | MATCH 'broken.go:4:9-23: undefined: undefinedThing'

  rm broken.go

  # the same requests forwarded over LSP to a separate long-running gopls
  # daemon, as shared-daemon editor setups do
  # (with its output redirected so spread doesn't wait on it)
  gopls serve -listen="unix;$PWD/../gopls.sock" > /dev/null 2>&1 &
  echo $! > ../gopls.pid
  for _ in $(seq 30); do
    test -S ../gopls.sock && break
    sleep 1
  done
  gopls -remote="unix;$PWD/../gopls.sock" definition main.go:10:14 | MATCH 'main.go:5:6-11: defined here as func greet\(name string\) string'
  gopls -remote="unix;$PWD/../gopls.sock" check main.go 2>&1 | NOMATCH .
