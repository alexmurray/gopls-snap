project: gopls-snap

backends:
  # spread integration for image-garden(1) (https://gitlab.com/zygoon/image-garden)
  # - downloads and caches official cloud images and boots them under
  # QEMU/KVM, so there's no manual image-baking. Needs the image-garden snap
  # (`snap install image-garden`) and /dev/kvm access - GitHub's standard
  # hosted runners have both (see github.com/zyga/image-garden-action).
  garden:
    type: adhoc
    allocate: |
      if [ -n "${SPREAD_HOST_PATH-}" ]; then
        PATH="${SPREAD_HOST_PATH}"
      fi
      exec image-garden allocate --spread "$SPREAD_SYSTEM"."$(uname -m)"
    discard: |
      if [ -n "${SPREAD_HOST_PATH-}" ]; then
        PATH="${SPREAD_HOST_PATH}"
      fi
      exec image-garden discard "$SPREAD_SYSTEM_ADDRESS"
    systems:
      # ordered by number of installs
      - ubuntu-cloud-24.04:
          username: ubuntu
          password: ubuntu
      - ubuntu-cloud-22.04:
          username: ubuntu
          password: ubuntu
      - ubuntu-cloud-26.04:
          username: ubuntu
          password: ubuntu
      - ubuntu-cloud-20.04:
          username: ubuntu
          password: ubuntu

path: /spread/gopls-snap

exclude:
  - .git
  - .github
  # image-garden(1) VM images, logs and state, plus spread's own logs, all
  # left in the repo root by `spread garden:...` runs (see .gitignore) -
  # without these, spread uploads many GB of VM images into every VM
  - .image-garden
  - "*.qcow2"
  - "*.img"
  - "*.iso"
  - "*.log"
  - "*.run"
  - "*.user-data"
  - "*.meta-data"
  - "*.lock"

# make sure we don't get killed during prepare
kill-timeout: 30m

environment:
  CHANNEL/latest_stable: latest/stable
  CHANNEL/latest_candidate: latest/candidate
  CHANNEL/latest_beta: latest/beta
  CHANNEL/latest_edge: latest/edge
  # installs the gopls_*.snap in the project directory (from `snapcraft
  # pack`) instead of a store revision
  CHANNEL/local: local
  # the tests never need the network beyond the snap store - keep the go
  # toolchain from trying to download modules or a newer toolchain
  GOPROXY: "off"
  GOTOOLCHAIN: local
  GOTELEMETRY: "off"

suites:
  tests/:
    summary: spread tests
    prepare: |
      # ensure machine is up to date
      export DEBIAN_FRONTEND=noninteractive
      # use apt-get to support older Ubuntu releases
      apt-get update
      apt-get -o Dpkg::Options::="--force-confold" -o Dpkg::Options::="--force-confdef" upgrade -y
      apt-get autoremove --purge -y
      apt-get install -y snapd python3
      snap wait system seed.loaded
      # gopls shells out to the go command to load packages, so it is no
      # use without a go toolchain
      snap install go --classic

    prepare-each: |
      # installs occasionally hit a transient store error (a local snap
      # still downloads its base) - retry a few times rather than failing
      # the whole task on a blip
      if [ "$CHANNEL" = local ]; then
        install_snap() { snap install --classic --dangerous "$(ls -t $SPREAD_PATH/gopls_*.snap | head -n 1)"; }
      else
        install_snap() { snap install --classic --channel "$CHANNEL" gopls; }
      fi
      n=0
      until install_snap; do
        n=$((n + 1))
        if [ $n -ge 3 ]; then
          exit 1
        fi
        sleep 10
      done

    restore-each: |
      snap remove --purge gopls
      rm -rf ~/snap/gopls ~/.cache/gopls
