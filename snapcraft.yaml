name: gopls
version: 0.24.0
summary: gopls, the Go Language Server
description: |
  gopls (pronounced "Go please") is the official Go language server
  developed by the Go team. It provides IDE features to any LSP-compatible
  editor.
license: BSD-3-Clause

base: core24
confinement: classic
grade: stable

apps:
  gopls:
    command: bin/gopls

parts:
  gopls:
    plugin: go
    source: https://github.com/golang/tools.git
    source-tag: gopls/v$SNAPCRAFT_PROJECT_VERSION
    source-subdir: gopls
    # classic confinement runs the binary against the host's libc, so build
    # it statically to keep it working on releases older than the core24 base
    build-environment:
      - CGO_ENABLED: "0"
    build-packages:
      - git
      - gcc
    build-snaps:
      - go
